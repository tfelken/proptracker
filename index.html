<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Withdrawal Calculator</title>
<style>
  :root {
    --bg: #f4f2ed;
    --surface: #ffffff;
    --surface-2: #faf9f6;
    --line: #e6e2da;
    --line-strong: #d6d1c7;
    --ink: #1f2421;
    --ink-soft: #5c6360;
    --ink-faint: #939995;
    --accent: #1f6f5c;
    --accent-soft: #e3efe9;
    --eval: #6b4ea8;
    --eval-soft: #ede7f6;
    --pos: #1f7a4d;
    --neg: #b3402f;
    --warn: #a76f1a;
    --warn-soft: #fbf2df;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "tnum" 1, "cv01" 1;
  }
  .num { font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  main { max-width: 1100px; margin: 0 auto; padding: 32px 28px 80px; }

  /* TOP BAR */
  .topbar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 28px; }
  .brand { margin-right: auto; }
  .brand h1 { font-size: 16px; font-weight: 650; letter-spacing: -0.02em; }
  .brand .sub { font-size: 12px; color: var(--ink-faint); margin-top: 1px; }
  .sel-wrap { position: relative; }
  select.acct-select {
    appearance: none; background: var(--surface); color: var(--ink);
    border: 1px solid var(--line-strong); border-radius: 9px;
    padding: 10px 38px 10px 14px; font-family: inherit; font-size: 14px; font-weight: 500;
    cursor: pointer; min-width: 260px; outline: none; transition: border-color .12s, box-shadow .12s;
  }
  select.acct-select:hover { border-color: var(--ink-faint); }
  select.acct-select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .sel-wrap::after { content: '⌄'; position: absolute; right: 15px; top: 44%; transform: translateY(-50%); color: var(--ink-faint); pointer-events: none; font-size: 16px; }
  .btn {
    background: var(--surface); color: var(--ink-soft); border: 1px solid var(--line-strong);
    padding: 10px 14px; border-radius: 9px; cursor: pointer; font-family: inherit;
    font-size: 13px; font-weight: 500; transition: all .12s;
  }
  .btn:hover { border-color: var(--ink-faint); color: var(--ink); }
  .btn.danger:hover { border-color: var(--neg); color: var(--neg); }

  /* HEADER */
  .header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
  .header-left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .header h2 { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; cursor: text; border-radius: 4px; padding: 1px 4px; margin: -1px -4px; }
  .header h2:hover { background: var(--surface); }
  .header h2:focus { outline: none; background: var(--surface); box-shadow: 0 0 0 2px var(--accent-soft); }
  .meta { font-size: 12px; color: var(--ink-faint); }
  .pill { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; padding: 3px 10px; border-radius: 20px; font-weight: 600; }
  .pill.eval { background: var(--eval-soft); color: var(--eval); }
  .pill.perf { background: var(--accent-soft); color: var(--accent); }

  .mode-toggle { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 9px; overflow: hidden; background: var(--surface); }
  .mode-toggle button { background: transparent; border: none; color: var(--ink-faint); padding: 8px 15px; font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer; transition: all .12s; }
  .mode-toggle button.active.eval { background: var(--eval); color: #fff; }
  .mode-toggle button.active.perf { background: var(--accent); color: #fff; }
  .mode-toggle button:not(.active):hover { color: var(--ink); }

  /* PRIORITY STACK */
  .section-label { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-faint); margin: 0 0 12px; font-weight: 600; }

  .range-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 22px 24px; margin-bottom: 14px;
  }
  .range-card.accent-eval { border-color: var(--eval); box-shadow: 0 1px 0 var(--eval-soft), 0 8px 24px -18px rgba(107,78,168,.5); }
  .range-card.accent-perf { border-color: var(--accent); box-shadow: 0 1px 0 var(--accent-soft), 0 8px 24px -18px rgba(31,111,92,.5); }
  .range-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; flex-wrap: wrap; gap: 8px; }
  .range-top .title { font-size: 13px; font-weight: 600; color: var(--ink-soft); }
  .range-top .ctx { font-size: 12px; color: var(--ink-faint); }

  .range-band { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin: 10px 0 4px; }
  .range-end { text-align: center; }
  .range-end .cap { font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 3px; }
  .range-end .amt { font-size: 32px; font-weight: 680; letter-spacing: -0.03em; }
  .range-end .amt.min { color: var(--accent); }
  .range-end .amt.max { color: var(--ink); }
  .range-end .amt.eval { color: var(--eval); }
  .range-arrow { flex: 1; height: 2px; background: linear-gradient(90deg, var(--line-strong), var(--line)); border-radius: 2px; min-width: 40px; position: relative; }
  .range-note { font-size: 12px; color: var(--ink-soft); margin-top: 10px; line-height: 1.5; }
  .range-flag { margin-top: 12px; font-size: 12px; color: var(--warn); background: var(--warn-soft); border: 1px solid #ecd9ad; border-radius: 8px; padding: 9px 12px; line-height: 1.5; }

  .sub-stats { display: flex; gap: 28px; flex-wrap: wrap; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
  .sub-stat .k { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-faint); }
  .sub-stat .v { font-size: 17px; font-weight: 620; letter-spacing: -0.02em; margin-top: 2px; }

  /* metric rows (remaining, above buffer, withdrawal, after) */
  .metric-stack { display: grid; gap: 10px; margin-bottom: 28px; }
  .metric {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .metric.editable:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .metric .left .label { font-size: 13px; font-weight: 600; color: var(--ink); }
  .metric .left .desc { font-size: 12px; color: var(--ink-faint); margin-top: 1px; }
  .metric .val { font-size: 22px; font-weight: 640; letter-spacing: -0.02em; text-align: right; }
  .metric .val.pos { color: var(--pos); }
  .metric .val.neg { color: var(--neg); }
  .metric input.val-input {
    font-family: inherit; font-size: 22px; font-weight: 640; letter-spacing: -0.02em; text-align: right;
    border: none; background: transparent; color: var(--ink); width: 160px; outline: none;
    font-variant-numeric: tabular-nums;
  }
  .metric input.val-input:focus { color: var(--accent); }

  /* INPUTS */
  .inputs-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(155px, 1fr)); gap: 10px; margin-bottom: 30px; }
  .input-card { background: var(--surface); border: 1px solid var(--line); border-radius: 11px; padding: 11px 14px; transition: border-color .12s, box-shadow .12s; }
  .input-card:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .input-card label { display: block; font-size: 11px; letter-spacing: .03em; color: var(--ink-faint); margin-bottom: 5px; }
  .input-card input { width: 100%; background: transparent; border: none; color: var(--ink); font-family: inherit; font-size: 16px; font-weight: 600; outline: none; padding: 0; font-variant-numeric: tabular-nums; }
  .input-card.locked { opacity: .55; }
  .input-card .hint { font-size: 10px; color: var(--ink-faint); margin-top: 4px; }

  /* TWO COL */
  .two-col { display: grid; grid-template-columns: minmax(0,1fr) minmax(260px,330px); gap: 22px; }
  @media (max-width: 820px) { .two-col { grid-template-columns: 1fr; } main { padding: 24px 16px 60px; } .range-end .amt { font-size: 27px; } }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .panel-head { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
  .panel-head h3 { font-size: 13px; font-weight: 650; }
  .panel-head button { background: var(--surface-2); border: 1px solid var(--line-strong); color: var(--ink-soft); padding: 5px 11px; border-radius: 7px; cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 500; transition: all .12s; }
  .panel-head button:hover { border-color: var(--accent); color: var(--accent); }
  table { width: 100%; border-collapse: collapse; }
  thead th { font-size: 11px; letter-spacing: .03em; color: var(--ink-faint); text-align: right; padding: 9px 18px; font-weight: 600; border-bottom: 1px solid var(--line); }
  thead th:first-child { text-align: left; width: 64px; }
  thead th:last-child { width: 38px; }
  tbody tr { border-bottom: 1px solid var(--line); }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--surface-2); }
  tbody td { padding: 0; text-align: right; }
  tbody td:first-child { text-align: left; padding: 10px 18px; color: var(--ink-faint); font-size: 13px; }
  tbody td input { width: 100%; background: transparent; border: none; color: var(--ink); font-family: inherit; font-size: 14px; text-align: right; padding: 10px 18px; outline: none; font-variant-numeric: tabular-nums; font-weight: 500; }
  tbody td input:focus { background: var(--accent-soft); color: var(--accent); }
  tbody td.cons { padding: 10px 18px; font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  tbody td.cons.over { color: var(--neg); font-weight: 700; }
  tbody td .row-del { background: transparent; border: none; color: var(--ink-faint); cursor: pointer; padding: 10px 12px; font-size: 16px; opacity: 0; transition: opacity .12s, color .12s; line-height: 1; }
  tbody tr:hover .row-del { opacity: 1; }
  tbody td .row-del:hover { color: var(--neg); }
  tfoot td { padding: 12px 18px; background: var(--surface-2); font-size: 13px; border-top: 1px solid var(--line-strong); font-variant-numeric: tabular-nums; }
  tfoot td:first-child { text-align: left; color: var(--ink-faint); font-weight: 600; }
  tfoot td:nth-child(2), tfoot td:nth-child(3) { text-align: right; font-weight: 700; }

  .side-block { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; }
  .side-block h3 { font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-faint); font-weight: 650; margin-bottom: 12px; }
  .srow { display: flex; justify-content: space-between; align-items: baseline; padding: 7px 0; font-size: 13px; border-bottom: 1px solid var(--line); }
  .srow:last-child { border-bottom: none; }
  .srow .k { color: var(--ink-soft); }
  .srow .v { font-weight: 650; font-variant-numeric: tabular-nums; }
  .srow .v.accent { color: var(--accent); }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 6px; border: 2px solid var(--bg); }
</style>
</head>
<body>
<main>
  <div class="topbar">
    <div class="brand">
      <h1>Withdrawal Calculator</h1>
      <div class="sub">Prop firm account tracker</div>
    </div>
    <div class="sel-wrap"><select class="acct-select" id="acctSelect"></select></div>
    <button class="btn" id="addBtn">+ Add</button>
    <button class="btn" id="historyBtn">History</button>
    <button class="btn" id="exportBtn">Export</button>
    <button class="btn" id="importBtn">Import</button>
    <button class="btn danger" id="delBtn">Delete</button>
    <button class="btn danger" id="resetBtn">Reset all</button>
    <input type="file" id="importFile" accept="application/json,.json" style="display:none">
  </div>
  <div id="content"></div>
</main>

<div id="historyModal" style="display:none;position:fixed;inset:0;background:rgba(20,22,20,.45);z-index:50;align-items:flex-start;justify-content:center;padding:48px 16px;overflow:auto">
  <div style="background:var(--surface);border:1px solid var(--line);border-radius:14px;max-width:760px;width:100%;box-shadow:0 24px 60px -20px rgba(0,0,0,.4)">
    <div style="display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)">
      <h2 style="font-size:18px;font-weight:600">Withdrawal History</h2>
      <button class="btn" id="historyClose">Close</button>
    </div>
    <div id="historyBody" style="padding:8px 22px 22px"></div>
  </div>
</div>

<script>
const STORAGE_KEY = 'propfirm_calc_v1';
const DEFAULT_DAYS = 11, EVAL_MIN_DAYS = 4, TARGET_PCT = 0.10, CONSISTENCY_CAP = 0.30;

function blankAccount(name){
  return { id:'a_'+Math.random().toString(36).slice(2,9), name:name||'New Account',
    mode:'performance', baseSize:50000, startBal:50000, buffer:375, minDays:1, withdrawal:0,
    profits:Array(DEFAULT_DAYS).fill(null) };
}
function seedAccounts(){
  const mk=(name,mode,baseSize,startBal,buffer,minDays,withdrawal,profits)=>{
    const p=Array(Math.max(DEFAULT_DAYS,profits.length)).fill(null);
    profits.forEach((v,i)=>p[i]=v);
    return { id:'a_'+Math.random().toString(36).slice(2,9), name,mode,baseSize,startBal,buffer,minDays,withdrawal,profits:p };
  };
  return [
    mk('Act 1 - 2450','performance',50000,52955.40,375,1,5000,[837.6,1062.4,1224.0]),
    mk('Act 2 - 2714','performance',50000,50000.00,375,2,0,[437.6,514.6,1288.4]),
    mk('Act 3-B - 2739','performance',50000,50000.00,375,3,0,[100.8,1246.8]),
    mk('Act 4 - 55166','evaluation',150000,52955.40,375,2,4500,[1814.6,5160.8]),
    mk('Act 5 - 55165','evaluation',150000,52955.40,375,2,4500,[1543.0,4322.8]),
    blankAccount('Account 6'),blankAccount('Account 7'),blankAccount('Account 8'),
    blankAccount('Account 9'),blankAccount('Account 10'),
  ];
}
function migrate(a){ if(!a.mode)a.mode='performance'; if(a.minDays==null)a.minDays=1; if(!Array.isArray(a.profits))a.profits=Array(DEFAULT_DAYS).fill(null); return a; }
let state;
function loadState(){
  try{ const raw=localStorage.getItem(STORAGE_KEY);
    if(raw){ const p=JSON.parse(raw);
      if(p&&Array.isArray(p.accounts)&&p.accounts.length){ p.accounts.forEach(migrate);
        if(!p.accounts.find(a=>a.id===p.activeId))p.activeId=p.accounts[0].id;
        if(!Array.isArray(p.withdrawals)) p.withdrawals=[];
        return p; } }
  }catch(e){ console.warn(e); }
  const accounts=seedAccounts(); return { accounts, activeId:accounts[0].id, withdrawals:[] };
}
function saveState(){ try{ localStorage.setItem(STORAGE_KEY,JSON.stringify(state)); }catch(e){ console.warn(e); } }
state=loadState();

const fmt$=n=>{ if(n==null||isNaN(n))return'$0.00'; const neg=n<0,abs=Math.abs(n); const s='$'+abs.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); return neg?'('+s+')':s; };
const fmt$0=n=>(n==null||isNaN(n))?'$0':(n<0?'(':'')+'$'+Math.abs(n).toLocaleString('en-US',{maximumFractionDigits:0})+(n<0?')':'');
const fmtPct=n=>(n==null||isNaN(n))?'0.0%':(n*100).toFixed(1)+'%';
function activeAccount(){ return state.accounts.find(a=>a.id===state.activeId); }
function acctNumber(name){ const m=String(name).match(/(\d{3,})\s*$/); return m?m[1]:null; }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function statusText(c, isEval){
  if (c.targetMet) return isEval ? 'READY' : 'AVAILABLE';
  // not met — report the most relevant blocker (order: dollar/target, then consistency, then days)
  if (isEval) {
    if (c.totalProfit < c.effectiveTarget) return 'NEED PROFIT';
    if (!c.consistencyOk) return 'FIX 30%';
    if (!c.daysOk) return `NEED ${EVAL_MIN_DAYS - c.numDays}D`;
    return 'NOT YET';
  } else {
    if (!c.dollarOk) return 'NEED PROFIT';
    if (!c.consistencyOk) return 'FIX 30%';
    if (!c.daysOk) return `NEED ${EVAL_MIN_DAYS - c.numDays}D`;
    return 'NOT YET';
  }
}
function compute(acct){  const profits=acct.profits.map(p=>(p==null||p===''||isNaN(p))?null:Number(p));
  const entered=profits.filter(p=>p!=null);
  const totalProfit=entered.reduce((s,v)=>s+v,0);
  const numDays=entered.length;
  const highestDay=entered.length?Math.max(...entered):0;
  const runningBalance=(Number(acct.startBal)||0)+totalProfit;
  const aboveBuffer=runningBalance-(Number(acct.buffer)||0);
  const aboveBufferAndBase=aboveBuffer-(Number(acct.baseSize)||0);
  const remainingAfterWD=totalProfit-(Number(acct.buffer)||0)-(Number(acct.withdrawal)||0);

  // consistency-based per-day figures
  const minFixConsistency=highestDay>0?Math.max(0,(highestDay/CONSISTENCY_CAP)-totalProfit):0;

  const avgWin=numDays>0?totalProfit/numDays:0;
  const onePerTrade=avgWin/5;
  const consistencies=profits.map(p=>(p==null||totalProfit===0)?null:(p/totalProfit));

  // target depends on mode
  const isEval=acct.mode==='evaluation';
  const baseTarget=(Number(acct.baseSize)||0)*TARGET_PCT;
  const consistencyFloor=highestDay>0?(highestDay/CONSISTENCY_CAP):0;
  const targetRaised=isEval && consistencyFloor>baseTarget;
  const effectiveTarget=isEval?Math.max(baseTarget,consistencyFloor):0;

  // shared rule checks
  const consistencyOk = highestDay===0 || (totalProfit>0 && (highestDay/totalProfit)<=CONSISTENCY_CAP);
  const daysOk = numDays >= EVAL_MIN_DAYS;
  // gap of profit needed purely to satisfy consistency
  const consGap = highestDay>0 ? Math.max(0,(highestDay/CONSISTENCY_CAP)-totalProfit) : 0;

  // PERFORMANCE target: become withdrawal-ELIGIBLE = clear $ headroom AND consistency AND 4 days.
  //   dollar gap = profit needed so (start - buffer - base) + total >= withdrawal
  const headroom = (Number(acct.startBal)||0) - (Number(acct.buffer)||0) - (Number(acct.baseSize)||0);
  const dollarGap = Math.max(0, ((Number(acct.withdrawal)||0) - headroom) - totalProfit);
  const perfRemaining = Math.max(dollarGap, consGap);
  const dollarOk = dollarGap <= 0;
  // EVAL remaining (target already folds in the consistency floor):
  const evalRemaining = Math.max(0, effectiveTarget - totalProfit);

  const remainingToTarget = isEval ? evalRemaining : perfRemaining;
  // which constraint is binding the performance remaining?
  const consBinding = !isEval && consGap > dollarGap && consGap > 0;

  // ---- MINIMUM TRADING DAYS TO TARGET ----
  // Hard rule: at least EVAL_MIN_DAYS (4) TOTAL trading days for both eval pass and withdrawal.
  // Days still needed just to satisfy that floor (accounting for days already traded):
  const floorDaysRemaining = Math.max(0, EVAL_MIN_DAYS - numDays);
  // Consistency-driven minimum: once `remainingToTarget` is added, the final total is fixed and
  // every single day must be <= 30% of that final total. The fewest NEW days to carry the
  // remaining amount under that per-day cap:
  const finalTotal = totalProfit + remainingToTarget;
  const perDayCap = CONSISTENCY_CAP * finalTotal;            // max any single day may be
  // The per-day ceiling IS the max allowed per day (30% of the final total). When consistency
  // is the binding constraint this equals the highest existing day.
  const maxToday = perDayCap;
  const consDaysNeeded = (remainingToTarget > 1e-9 && perDayCap > 1e-9)
    ? Math.ceil(remainingToTarget / perDayCap) : 0;
  // Minimum days to be eligible = the larger of the consistency requirement and the 4-day floor.
  const minDaysToTarget = Math.max(consDaysNeeded, floorDaysRemaining, (remainingToTarget>1e-9?1:0));
  // For averaging we never want a 0 denominator.
  const effDays = Math.max(1, minDaysToTarget);
  const dailyAvgNeeded = remainingToTarget / effDays;
  // Days remaining kept for display compatibility (now = minimum days to target).
  const daysRemaining = minDaysToTarget;

  // full eligibility: every rule satisfied
  const targetMet = isEval
    ? (totalProfit>=effectiveTarget && effectiveTarget>0 && daysOk && consistencyOk)
    : (dollarOk && consistencyOk && daysOk);

  return { profits, entered, totalProfit, numDays, highestDay, runningBalance, aboveBuffer,
    aboveBufferAndBase, remainingAfterWD, minFixConsistency, maxToday, avgWin, onePerTrade, consistencies,
    isEval, baseTarget, consistencyFloor, targetRaised, effectiveTarget, remainingToTarget,
    daysRemaining, effDays, dailyAvgNeeded, minDaysToTarget, consDaysNeeded, floorDaysRemaining, perDayCap, targetMet,
    consistencyOk, daysOk, dollarOk, consGap, dollarGap, consBinding };
}

function renderSelect(){
  const sel=document.getElementById('acctSelect'); sel.innerHTML='';
  state.accounts.forEach(a=>{
    const opt=document.createElement('option'); opt.value=a.id;
    const num=acctNumber(a.name);
    const tag=a.mode==='evaluation'?'EVAL':'PERF';
    opt.textContent=`[${tag}]  ${a.name}`+(num&&!a.name.includes(num)?`  (#${num})`:'');
    opt.selected=a.id===state.activeId; sel.appendChild(opt);
  });
}

function buildComputedTop(acct, c){
  const isEval=c.isEval;
  const accentClass = isEval?'accent-eval':'accent-perf';
  const targetWord = isEval ? 'eval target' : 'withdrawal target';
  let rangeBody;
  // Final-day view only when the target can be reached in exactly one more trading day
  // (the minimum-days model already accounts for the 30% cap and the 4-day floor).
  const lastDay = c.remainingToTarget > 0 && c.minDaysToTarget === 1;

  if (lastDay) {
    const note = c.minFixConsistency>0
      ? `One day clears this. You need at least <strong>${fmt$0(c.minFixConsistency)}</strong> to bring your biggest day (${fmt$0(c.highestDay)}) under 30% of total. Don't exceed <strong>${fmt$0(c.maxToday)}</strong> or today itself breaks the 30% cap.`
      : `One day clears this. You can make up to <strong>${fmt$0(c.maxToday)}</strong> today without any single day exceeding 30% of total.`;
    rangeBody = `
      <div class="range-band">
        <div class="range-end"><div class="cap">Daily Min</div><div class="amt min num">${fmt$0(c.minFixConsistency)}</div></div>
        <div class="range-arrow"></div>
        <div class="range-end"><div class="cap">Daily Max</div><div class="amt max num">${fmt$0(c.maxToday)}</div></div>
      </div>
      <div class="range-note">${note}</div>`;
  } else {
    let note;
    if (c.remainingToTarget<=0) {
      const blockers = [];
      if (!c.daysOk) blockers.push(`${EVAL_MIN_DAYS - c.numDays} more trading day${(EVAL_MIN_DAYS-c.numDays)===1?'':'s'}`);
      if (!c.consistencyOk) blockers.push('a fix to the 30% consistency rule');
      if (isEval) {
        note = blockers.length
          ? `Profit target reached, but you still need ${blockers.join(' and ')} before the eval passes.`
          : `Eval passed — target reached, ${EVAL_MIN_DAYS}-day minimum met, consistency clean.`;
      } else {
        note = blockers.length
          ? `Dollar &amp; consistency cover a ${fmt$0(acct.withdrawal)} withdrawal, but you still need ${blockers.join(' and ')} before it's eligible.`
          : `Eligible — your ${fmt$0(acct.withdrawal)} withdrawal is available. Anything more is growth.`;
      }
    } else {
      const why = (!isEval && c.consBinding) ? ' (consistency is the binding constraint, not the dollar amount)' : (isEval && c.targetRaised ? ' (target raised by consistency)' : '');
      const span = `over <strong>${c.effDays}</strong> day${c.effDays===1?'':'s'}`;
      // explain what is setting the day count
      let driver = '';
      if (c.consDaysNeeded > c.floorDaysRemaining && c.consDaysNeeded > 1) {
        driver = ` The 30% rule sets the pace here: no single day can exceed ${fmt$0(c.perDayCap)} of the final total, so it takes ${c.consDaysNeeded} days minimum.`;
      } else if (c.floorDaysRemaining >= c.consDaysNeeded && c.floorDaysRemaining > 0) {
        driver = ` You're held to the ${EVAL_MIN_DAYS}-day minimum (${c.floorDaysRemaining} more to go), so you have room to pace it.`;
      }
      note = `Need <strong>${fmt$0(c.remainingToTarget)}</strong> more profit to ${isEval?'pass':'become eligible for the '+fmt$0(acct.withdrawal)+' withdrawal'}${why}. Spread ${span}, that's about <strong>${fmt$0(c.dailyAvgNeeded)}</strong>/day.${driver}`;
    }
    rangeBody = `
      <div class="range-band">
        <div class="range-end"><div class="cap">Min to Be Eligible</div><div class="amt ${isEval?'eval':'min'} num">${c.remainingToTarget<=0?'$0':fmt$0(c.remainingToTarget)}</div></div>
        <div class="range-arrow"></div>
        <div class="range-end"><div class="cap">Avg / Day Needed</div><div class="amt max num">${fmt$0(c.dailyAvgNeeded)}</div></div>
      </div>
      <div class="range-note">${note}</div>`;
  }

  const ctxLabel = lastDay ? 'Final day · consistency band' : `${c.effDays} day${c.effDays===1?'':'s'} to target`;
  let rangeFlag = '';
  if (isEval && c.targetRaised) {
    rangeFlag = `<div class="range-flag">⚠ Target raised above the ${fmt$0(c.baseTarget)} base (10%). Your best day of ${fmt$0(c.highestDay)} requires a total of at least ${fmt$0(c.consistencyFloor)} to keep that day ≤ 30%.</div>`;
  } else if (!isEval && c.consBinding) {
    rangeFlag = `<div class="range-flag">⚠ Consistency is the binding constraint. Your dollar headroom already covers the withdrawal, but your best day (${fmt$0(c.highestDay)}) needs total profit ≥ ${fmt$0(c.consistencyFloor)} to stay ≤ 30%.</div>`;
  }

  const rangeCard = `
    <div class="section-label">Target Range — ${targetWord}</div>
    <div class="range-card ${accentClass}">
      <div class="range-top">
        <div class="title">${lastDay?'Last-day range (min to fix consistency → max allowed)':'Path to target'}</div>
        <div class="ctx">${ctxLabel}</div>
      </div>
      ${rangeBody}
      ${rangeFlag}
      <div class="sub-stats">
        <div class="sub-stat"><div class="k">Total Profit So Far</div><div class="v num">${fmt$(c.totalProfit)}</div></div>
        <div class="sub-stat"><div class="k">Min Days To Target</div><div class="v num">${c.remainingToTarget>0?c.minDaysToTarget:(c.targetMet?'—':c.floorDaysRemaining||'—')}</div></div>
        <div class="sub-stat"><div class="k">Max / Highest Single Day</div><div class="v num">${fmt$0(c.highestDay)}</div></div>
        <div class="sub-stat"><div class="k">${isEval?'Pass status':'Withdraw status'}</div><div class="v num" style="color:${c.targetMet?'var(--pos)':'var(--neg)'}">${statusText(c, isEval)}</div></div>
      </div>
    </div>`;

  const metricStack = `
    <div class="metric-stack">
      <div class="metric">
        <div class="left"><div class="label">Remaining to Target</div><div class="desc">${isEval?'Profit still needed to pass eval':'Min profit to become withdrawal-eligible'}</div></div>
        <div class="val num ${(c.remainingToTarget<=0 && c.targetMet)?'pos':''}">${c.remainingToTarget<=0?(c.targetMet?'— eligible —':'$0 (other rules pending)'):fmt$0(c.remainingToTarget)}</div>
      </div>
      <div class="metric">
        <div class="left"><div class="label">Balance Above Buffer</div><div class="desc">Running balance minus ${fmt$0(acct.buffer)} buffer</div></div>
        <div class="val num">${fmt$(c.aboveBuffer)}</div>
      </div>
      <div class="metric editable">
        <div class="left"><div class="label">Withdrawal Amount</div><div class="desc">Planned cash-out this cycle</div></div>
        <div style="display:flex;align-items:center;gap:12px">
          <input class="val-input num" type="number" step="any" id="m-withdrawal" value="${acct.withdrawal}">
          <button class="btn" id="completeWdBtn" style="white-space:nowrap;${(acct.withdrawal>0)?'border-color:var(--accent);color:var(--accent)':'opacity:.5'}" ${(acct.withdrawal>0)?'':'disabled'}>Complete W/D ✓</button>
        </div>
      </div>
      <div class="metric">
        <div class="left"><div class="label">Balance After Withdrawal</div><div class="desc">Profit − buffer − withdrawal</div></div>
        <div class="val num ${c.remainingAfterWD>=0?'pos':'neg'}" id="balAfterWD">${fmt$(c.remainingAfterWD)}</div>
      </div>
    </div>`;

  return rangeCard + metricStack;
}

// Live updater: recompute & refresh only derived regions, never the input being typed in.
function refreshComputed(){
  const acct=activeAccount(); if(!acct) return;
  const c=compute(acct);
  const active=document.activeElement;
  const typingInTop = active && document.getElementById('computedTop') && document.getElementById('computedTop').contains(active);

  // computedTop contains the withdrawal input; only rebuild it if focus isn't inside it
  if(!typingInTop){
    const top=document.getElementById('computedTop');
    if(top){ top.innerHTML=buildComputedTop(acct,c); wireComputedTop(acct); }
  } else {
    // focus is inside computedTop (the withdrawal field): update the dependent values directly
    const bal=document.getElementById('balAfterWD');
    if(bal){ bal.textContent=fmt$(c.remainingAfterWD); bal.classList.toggle('pos', c.remainingAfterWD>=0); bal.classList.toggle('neg', c.remainingAfterWD<0); }
    const cw=document.getElementById('completeWdBtn');
    if(cw){ const on=(Number(acct.withdrawal)||0)>0; cw.disabled=!on; cw.style.opacity=on?'1':'.5'; cw.style.borderColor=on?'var(--accent)':''; cw.style.color=on?'var(--accent)':''; }
  }
  const side=document.getElementById('sideCol');
  if(side) side.innerHTML=buildSideCol(acct,c);

  // table footer
  const ft=document.getElementById('footTotal'); if(ft) ft.textContent=fmt$(c.totalProfit);
  const fh=document.getElementById('footHigh'); if(fh) fh.textContent=(c.totalProfit!==0&&c.entered.length)?fmtPct(c.highestDay/c.totalProfit)+' high':'—';

  // per-row consistency cells (do not touch the inputs)
  const cells=document.querySelectorAll('#daysBody td.cons');
  cells.forEach((cell,i)=>{
    const v=c.consistencies[i];
    cell.textContent = v==null?'0.0%':fmtPct(v);
    cell.classList.toggle('over', v!=null && v>CONSISTENCY_CAP);
  });
}

// (re)bind the withdrawal input + complete button inside computedTop after it is rebuilt
function wireComputedTop(acct){
  const mw=document.getElementById('m-withdrawal');
  if(mw) mw.addEventListener('input',()=>{ const v=mw.value===''?0:parseFloat(mw.value); acct.withdrawal=isNaN(v)?0:v; saveState(); refreshComputed(); syncWithdrawalInputs('m-withdrawal'); });
  const cw=document.getElementById('completeWdBtn');
  if(cw) cw.addEventListener('click',()=>completeWithdrawal(acct));
}

// Record a withdrawal: bank it against the starting balance, reset the cycle, store the record.
function completeWithdrawal(acct){
  const wd = Number(acct.withdrawal)||0;
  if(wd<=0){ alert('Enter a withdrawal amount first.'); return; }
  const c = compute(acct);
  const total = c.totalProfit;
  const balanceBefore = (Number(acct.startBal)||0) + total;        // full account balance before W/D
  const newStartBal = balanceBefore - wd;                          // retained, becomes new baseline
  const msg = `Complete a ${fmt$(wd)} withdrawal on "${acct.name}"?\n\n`+
    `• Balance before: ${fmt$(balanceBefore)}\n`+
    `• New starting balance (since this W/D): ${fmt$(newStartBal)}\n`+
    `• This cycle's ${c.numDays} day${c.numDays===1?'':'s'} of profit will be cleared and archived.\n\n`+
    `This is recorded for tracking and can't be auto-undone.`;
  if(!confirm(msg)) return;

  const record = {
    id: 'w_'+Math.random().toString(36).slice(2,9),
    accountId: acct.id,
    accountName: acct.name,
    accountNumber: acctNumber(acct.name),
    mode: acct.mode,
    date: new Date().toISOString().slice(0,10),
    timestamp: new Date().toISOString(),
    amount: wd,
    profitThisCycle: total,
    daysThisCycle: c.numDays,
    buffer: Number(acct.buffer)||0,
    baseSize: Number(acct.baseSize)||0,
    startBalBefore: Number(acct.startBal)||0,
    balanceBefore: balanceBefore,
    startBalAfter: newStartBal,
    dailyProfits: acct.profits.filter(p=>p!=null),
  };
  if(!Array.isArray(state.withdrawals)) state.withdrawals=[];
  state.withdrawals.push(record);

  // reset the account for the new cycle
  acct.startBal = newStartBal;
  acct.withdrawal = 0;
  acct.profits = Array(DEFAULT_DAYS).fill(null);

  saveState();
  renderSelect();
  renderContent();
  alert(`Withdrawal of ${fmt$(wd)} recorded.\nNew starting balance: ${fmt$(newStartBal)}.\nCycle reset — ${state.withdrawals.length} withdrawal${state.withdrawals.length===1?'':'s'} stored.`);
}

// keep the two withdrawal inputs (metric + inputs grid) in sync without clobbering the focused one
function syncWithdrawalInputs(focusedId){
  const acct=activeAccount(); if(!acct) return;
  ['m-withdrawal','i-withdrawal'].forEach(id=>{
    if(id===focusedId) return;
    const el=document.getElementById(id);
    if(el && document.activeElement!==el) el.value=acct.withdrawal;
  });
}

      </div>

    </div>

      <div class="input-card"><label>Starting bal since last W/D</label><input type="number" id="i-startBal" step="any" value="${acct.startBal}"></div>
      <div class="input-card"><label>Buffer amount</label><input type="number" id="i-buffer" step="any" value="${acct.buffer}"></div>
      <div class="input-card ${isEval?'locked':''}"><label>Min total days (remaining)</label><input type="number" id="i-minDays" step="1" min="1" value="${acct.minDays}" ${isEval?'disabled':''}>${isEval?`<div class="hint">eval fixed at ${EVAL_MIN_DAYS} total</div>`:''}</div>
      <div class="input-card"><label>Withdrawal amount</label><input type="number" id="i-withdrawal" step="any" value="${acct.withdrawal}"></div>
    </div>

      <div class="panel">

        <table>

          <tbody id="daysBody"></tbody>
          <tfoot><tr><td>Total</td><td class="num" id="footTotal">${fmt$(c.totalProfit)}</td><td class="num" id="footHigh">${(c.totalProfit!==0&&c.entered.length)?fmtPct(c.highestDay/c.totalProfit)+' high':'—'}</td><td></td></tr></tfoot>
        </table>
      </div>

function wireInputs(acct){
  ['baseSize','startBal','buffer','minDays','withdrawal'].forEach(k=>{
    const el=document.getElementById('i-'+k); if(!el)return;
    el.addEventListener('input',()=>{ const v=el.value===''?0:parseFloat(el.value); acct[k]=isNaN(v)?0:v; saveState(); refreshComputed(); if(k==='withdrawal') syncWithdrawalInputs('i-withdrawal'); });
  });
  // mirrored withdrawal input inside metric stack
  const mw=document.getElementById('m-withdrawal');
  if(mw) mw.addEventListener('input',()=>{ const v=mw.value===''?0:parseFloat(mw.value); acct.withdrawal=isNaN(v)?0:v; saveState(); refreshComputed(); syncWithdrawalInputs('m-withdrawal'); });

  document.querySelectorAll('.mode-toggle button').forEach(btn=>{
    btn.addEventListener('click',()=>{ acct.mode=btn.dataset.mode; saveState(); renderSelect(); renderContent(); });
  });
  document.getElementById('addRowBtn').addEventListener('click',()=>{ acct.profits.push(null); saveState(); renderContent(); });

  const nameEl=document.getElementById('acctName');
  nameEl.addEventListener('blur',()=>{ const v=nameEl.textContent.trim(); if(v&&v!==acct.name){acct.name=v.slice(0,60);saveState();renderSelect();renderContent();} else nameEl.textContent=acct.name; });
  nameEl.addEventListener('keydown',e=>{ if(e.key==='Enter'){e.preventDefault();nameEl.blur();} if(e.key==='Escape'){nameEl.textContent=acct.name;nameEl.blur();} });
}

function renderDays(acct,c){
  const body=document.getElementById('daysBody'); body.innerHTML='';
  acct.profits.forEach((p,i)=>{
    const tr=document.createElement('tr');
    const cons=c.consistencies[i]; const over=cons!=null&&cons>CONSISTENCY_CAP;
    tr.innerHTML=`<td>Day ${i+1}</td>
      <td><input type="number" step="any" data-day="${i}" value="${p==null?'':p}" placeholder="—"></td>
      <td class="cons ${over?'over':''} num">${cons==null?'0.0%':fmtPct(cons)}</td>
      <td><button class="row-del" data-del="${i}" title="Remove">×</button></td>`;
    body.appendChild(tr);
  });
  body.querySelectorAll('input[data-day]').forEach(inp=>{
    inp.addEventListener('input',()=>{ const i=+inp.dataset.day; const v=inp.value===''?null:parseFloat(inp.value);
      acct.profits[i]=(v==null||isNaN(v))?null:v; saveState(); refreshComputed(); });
  });
  body.querySelectorAll('button[data-del]').forEach(btn=>{
    btn.addEventListener('click',()=>{ const i=+btn.dataset.del; acct.profits.splice(i,1); if(acct.profits.length<3)acct.profits.push(null); saveState(); renderContent(); });
  });
}

function render(){ renderSelect(); renderContent(); }

function renderHistory(){
  const body=document.getElementById('historyBody'); if(!body) return;
  const ws=(state.withdrawals||[]).slice().sort((a,b)=>(b.timestamp||'').localeCompare(a.timestamp||''));
  if(!ws.length){
    body.innerHTML='<p style="padding:24px 0;color:var(--ink-faint)">No withdrawals recorded yet. Enter a withdrawal amount on an account and click “Complete W/D ✓” to bank it and start a fresh cycle.</p>';
    return;
  }
  const total=ws.reduce((s,w)=>s+(Number(w.amount)||0),0);
  let rows=ws.map(w=>`
    <tr>
      <td style="text-align:left;padding:9px 10px;color:var(--ink-soft)">${w.date||''}</td>
      <td style="text-align:left;padding:9px 10px">${esc(w.accountName||'')}${w.mode?` <span style="color:var(--ink-faint);font-size:11px">(${w.mode})</span>`:''}</td>
      <td style="text-align:right;padding:9px 10px;font-weight:650" class="num">${fmt$(w.amount)}</td>
      <td style="text-align:right;padding:9px 10px;color:var(--ink-soft)" class="num">${fmt$(w.profitThisCycle)}</td>
      <td style="text-align:right;padding:9px 10px;color:var(--ink-soft)" class="num">${fmt$(w.startBalAfter)}</td>
      <td style="text-align:right;padding:9px 10px"><button class="btn" data-undo="${w.id}" style="padding:3px 9px;font-size:11px">Undo</button></td>
    </tr>`).join('');
  body.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 10px">
      <div style="color:var(--ink-faint);font-size:12px">${ws.length} withdrawal${ws.length===1?'':'s'} recorded</div>
      <div style="font-size:13px">Total withdrawn: <strong class="num">${fmt$(total)}</strong></div>
    </div>
    <table style="width:100%;border-collapse:collapse;font-size:13px">
      <thead><tr style="border-bottom:1px solid var(--line)">
        <th style="text-align:left;padding:8px 10px;font-size:11px;color:var(--ink-faint);font-weight:600">DATE</th>
        <th style="text-align:left;padding:8px 10px;font-size:11px;color:var(--ink-faint);font-weight:600">ACCOUNT</th>
        <th style="text-align:right;padding:8px 10px;font-size:11px;color:var(--ink-faint);font-weight:600">AMOUNT</th>
        <th style="text-align:right;padding:8px 10px;font-size:11px;color:var(--ink-faint);font-weight:600">CYCLE PROFIT</th>
        <th style="text-align:right;padding:8px 10px;font-size:11px;color:var(--ink-faint);font-weight:600">NEW START BAL</th>
        <th></th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <p style="color:var(--ink-faint);font-size:11px;margin-top:14px;line-height:1.5">Records are stored locally and travel with Export/Import. “Undo” reverses the most-recent withdrawal for that account only if its cycle hasn’t advanced — it restores the prior starting balance and re-adds the archived days.</p>`;
  // wire undo buttons
  body.querySelectorAll('button[data-undo]').forEach(btn=>{
    btn.addEventListener('click',()=>undoWithdrawal(btn.dataset.undo));
  });
}

function undoWithdrawal(wid){
  const idx=(state.withdrawals||[]).findIndex(w=>w.id===wid);
  if(idx<0) return;
  const w=state.withdrawals[idx];
  const acct=state.accounts.find(a=>a.id===w.accountId);
  if(!acct){ alert('That account no longer exists, so this record can’t be auto-reversed. You can delete the record by editing the export file.'); return; }
  // only safe to undo if the account hasn't started a new cycle (no profits entered since)
  const hasNewProfits = acct.profits.some(p=>p!=null);
  const startMatches = Math.abs((Number(acct.startBal)||0) - (Number(w.startBalAfter)||0)) < 0.005;
  if(hasNewProfits || !startMatches){
    if(!confirm('This account has changed since the withdrawal (new profits or an edited starting balance). Undo anyway?\n\nIt will restore the prior starting balance and re-add the archived days, overwriting the current cycle.')) return;
  } else {
    if(!confirm(`Undo the ${fmt$(w.amount)} withdrawal on "${w.accountName}"?\nThis restores the starting balance to ${fmt$(w.startBalBefore)} and re-adds ${(w.dailyProfits||[]).length} day(s).`)) return;
  }
  acct.startBal = Number(w.startBalBefore)||acct.startBal;
  acct.withdrawal = Number(w.amount)||0;
  const days = (w.dailyProfits||[]).slice();
  while(days.length < DEFAULT_DAYS) days.push(null);
  acct.profits = days;
  state.withdrawals.splice(idx,1);
  saveState();
  renderHistory();
  renderSelect();
  renderContent();
}

function wireGlobalControls(){
  const on=(id,evt,fn)=>{ const el=document.getElementById(id); if(el) el.addEventListener(evt,fn); };

  on('acctSelect','change',e=>{ state.activeId=e.target.value; saveState(); renderContent(); });

  on('addBtn','click',()=>{ if(state.accounts.length>=10){alert('Maximum 10 accounts.');return;} const a=blankAccount('Account '+(state.accounts.length+1)); state.accounts.push(a); state.activeId=a.id; saveState(); render(); });

  on('historyBtn','click',()=>{ renderHistory(); const m=document.getElementById('historyModal'); if(m) m.style.display='flex'; });
  on('historyClose','click',()=>{ const m=document.getElementById('historyModal'); if(m) m.style.display='none'; });
  on('historyModal','click',e=>{ if(e.target.id==='historyModal') e.target.style.display='none'; });

  on('delBtn','click',()=>{ const a=activeAccount(); if(!a) return; if(state.accounts.length<=1){alert('Cannot delete the last account.');return;} if(!confirm(`Delete "${a.name}"?\n\nThis removes the account and its current cycle. Stored withdrawal history is kept. This cannot be undone.`))return; const idx=state.accounts.findIndex(x=>x.id===a.id); state.accounts.splice(idx,1); state.activeId=state.accounts[0].id; saveState(); render(); });

  on('resetBtn','click',()=>{ if(!confirm('Reset ALL accounts to the original 5 + 5 blanks?\n\nThis wipes every account back to defaults. Stored withdrawal history is also cleared. This cannot be undone.'))return; const accounts=seedAccounts(); state={accounts,activeId:accounts[0].id,withdrawals:[]}; saveState(); render(); });

  // ---- Export / Import ----
  on('exportBtn','click',()=>{
    try{
      const payload = { app:'propfirm_calc', version:1, exportedAt:new Date().toISOString(), data:state };
      const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const stamp = new Date().toISOString().slice(0,10);
      a.href = url; a.download = `withdrawal-calc-${stamp}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 1000);
    }catch(e){ alert('Export failed: '+e.message); }
  });

  on('importBtn','click',()=>{ const f=document.getElementById('importFile'); if(f) f.click(); });
  on('importFile','change', e=>{
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const parsed = JSON.parse(reader.result);
        const incoming = parsed && parsed.data && Array.isArray(parsed.data.accounts) ? parsed.data
                       : (parsed && Array.isArray(parsed.accounts) ? parsed : null);
        if(!incoming || !Array.isArray(incoming.accounts) || !incoming.accounts.length){
          alert('That file doesn’t look like a valid withdrawal-calc export.'); e.target.value=''; return;
        }
        incoming.accounts.forEach(migrate);
        if(!incoming.accounts.find(a=>a.id===incoming.activeId)) incoming.activeId = incoming.accounts[0].id;
        if(!Array.isArray(incoming.withdrawals)) incoming.withdrawals=[];
        const n = incoming.accounts.length;
        const wn = incoming.withdrawals.length;
        if(!confirm(`Import ${n} account${n===1?'':'s'}${wn?` and ${wn} stored withdrawal${wn===1?'':'s'}`:''}?\n\nThis REPLACES all current data in this browser.`)) { e.target.value=''; return; }
        state = { accounts: incoming.accounts, activeId: incoming.activeId, withdrawals: incoming.withdrawals };
        saveState(); render();
        alert(`Imported ${n} account${n===1?'':'s'}${wn?` and ${wn} withdrawal record${wn===1?'':'s'}`:''}.`);
      }catch(err){
        alert('Import failed: '+err.message);
      }
      e.target.value = '';
    };
    reader.onerror = ()=>{ alert('Could not read that file.'); e.target.value=''; };
    reader.readAsText(file);
  });
}

// run after the DOM is parsed so all controls exist
function init(){ render(); wireGlobalControls(); }
if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded', init); } else { init(); }
</script>
</body>
</html>
